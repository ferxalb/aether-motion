name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$version"; exit 1; }
      # Release tags can restore from main, but cannot restore from other tags.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
        if: github.ref_type == 'tag'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="aether-motion-${GITHUB_REF_NAME}-$TARGET"
          mkdir -p "$name/assets/readme"
          cp LICENSE README.md CHANGELOG.md assets/fonts/LICENSE-Roboto.txt "$name/"
          cp assets/readme/hero.jpg assets/readme/motion-preview.gif "$name/assets/readme/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/aether-motion.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/$TARGET/release/aether-motion" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: ${{ matrix.target }}
          path: |
            aether-motion-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            aether-motion-${{ github.ref_name }}-${{ matrix.target }}.zip
          compression-level: 0
          if-no-files-found: error

  macos-universal:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-apple-darwin'
          merge-multiple: true
      - name: Create and verify the universal macOS executable
        shell: bash
        run: |
          prefix="aether-motion-${GITHUB_REF_NAME}"
          arm="$prefix-aarch64-apple-darwin"
          intel="$prefix-x86_64-apple-darwin"
          universal="$prefix-universal-apple-darwin"
          tar xzf "$arm.tar.gz"
          tar xzf "$intel.tar.gz"
          lipo -create "$arm/aether-motion" "$intel/aether-motion" -output aether-motion
          mv "$arm" "$universal"
          binary="$universal/aether-motion"
          mv aether-motion "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          codesign --force --sign - "$binary"
          codesign --verify --all-architectures "$binary"
          "$binary" --version
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 "$binary" --version
          tar czf "$universal.tar.gz" "$universal"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: universal-apple-darwin
          path: aether-motion-${{ github.ref_name }}-universal-apple-darwin.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: macos-universal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \\[$version\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/aether-motion-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz" \
            "dist/aether-motion-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/aether-motion-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Prepares the npm tarballs and stages updates through trusted publishing for maintainer approval.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 11 with staged publishing support
        run: npm install -g 'npm@^11.15.0' && npm --version
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Extract the binaries
        shell: bash
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            mkdir -p "bins/$t"
            tar xzf "dist/aether-motion-${GITHUB_REF_NAME}-$t.tar.gz" -C "bins/$t" --strip-components=1
          done
          t=x86_64-pc-windows-msvc
          mkdir -p "bins/$t"
          unzip -j -q "dist/aether-motion-${GITHUB_REF_NAME}-$t.zip" '*/aether-motion.exe' -d "bins/$t"
      - name: Assemble the npm package
        run: node npm/scripts/build-packages.mjs --version "${GITHUB_REF_NAME#v}" --binaries bins --out npm-dist
      - name: Pack the npm tarball
        run: |
          mkdir npm-tarballs
          npm pack ./npm-dist/cli --pack-destination npm-tarballs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error
      - name: Stage the package with npm Trusted Publishing
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          if npm view "@aether-motion/cli@$version" version >/dev/null 2>&1; then
            echo "@aether-motion/cli@$version is already published"
            exit 0
          fi
          npm stage publish "./npm-tarballs/aether-motion-cli-$version.tgz" --access public --tag "$tag"
