[package]
name = "aether-motion"
version = "0.2.1"
edition = "2021"
description = "AETHER Motion, a native video renderer for a documented subset of HyperFrames HTML"
license = "Apache-2.0"
readme = "README.md"
keywords = ["html", "video", "renderer", "mp4", "animation"]
categories = ["multimedia::video", "rendering", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
fontdb = "0.24"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kuchiki = "0.8"
mp4 = "0.14"
serde_json = "1"
openh264 = "0.9"
oxideav-aac = "0.1.7"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "flac", "ogg", "vorbis", "mp3", "pcm", "aac", "isomp4"] }
resvg = { version = "0.45", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
libm = "0.2"
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism"] }
# GPU backend for `data-hf-3d` scenes, included by default.
wgpu = { version = "30", optional = true, default-features = false, features = ["vulkan", "metal", "dx12", "wgsl", "std"] }
pollster = { version = "1.0", optional = true }

[features]
default = ["gpu"]
# wgpu backend for `data-hf-3d` scenes, selected with `--3d-backend gpu` or `AETHER_3D_BACKEND=gpu`.
gpu = ["dep:wgpu", "dep:pollster"]
# CUDA backend for `data-hf-3d` scenes (Linux, NVIDIA), selected with `--3d-backend cuda`. Opt-in:
# it loads libcuda at run time and needs the kernel built by `tools/build_cuda_kernel.py`.
cuda = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# oxideav-aac 0.1.7 with an FFT-based forward MDCT (about 70x faster than upstream); see
# vendor/oxideav-aac/AETHER-PATCH.md.
[patch.crates-io]
oxideav-aac = { path = "vendor/oxideav-aac" }
# openh264 0.9.10 with a `base_qp` option for the fixed quantizer; see vendor/openh264/AETHER-PATCH.md.
openh264 = { path = "vendor/openh264" }
