[package]
name = "aether-motion"
version = "0.1.0"
edition = "2021"
description = "AETHER Motion, a native video renderer for a documented subset of HyperFrames HTML"
license = "Apache-2.0"
readme = "README.md"
keywords = ["html", "video", "renderer", "mp4", "animation"]
categories = ["multimedia::video", "rendering", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
fontdb = "0.24"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kuchiki = "0.8"
mp4 = "0.14"
serde_json = "1"
openh264 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
