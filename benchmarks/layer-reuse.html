<!-- Exercises nested clipping, rotation, and element blur with reusable offscreen sizes. -->
<!doctype html><main data-composition-id="layers-bench" data-width="1920" data-height="1080" data-duration="2" style="background:#142338"><div data-hf-keyframes='[{"at":0,"x":0},{"at":2,"x":120}]' style="left:100px;top:100px;width:1200px;height:700px;overflow:hidden;border-radius:80px"><div style="left:60px;top:60px;width:900px;height:500px;transform:rotate(5deg);background:rgba(220,70,180,0.6)"><div style="left:40px;top:40px;width:600px;height:300px;background:rgba(60,170,240,0.8);filter:blur(8px)"></div></div></div></main>
