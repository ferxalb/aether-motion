<!-- Isolates animated large-radius inset shadow drawing over a gradient. -->
<!doctype html><html><body><div data-composition-id="inset-bench" data-width="1920" data-height="1080" data-duration="2" style="background:#142338"><div class="clip" data-start="0" data-duration="2" data-track-index="0" style="width:1920px;height:1080px;background:linear-gradient(to right,#193652,#ad617c)"></div><div class="clip" data-start="0" data-duration="2" data-track-index="1" data-hf-keyframes='[{"at":0,"x":0},{"at":2,"x":20}]' style="left:10px;top:10px;width:1880px;height:1040px;border-radius:300px;box-shadow:inset 8px 12px 24px 3px rgba(0,0,0,0.7)"></div></div></body></html>
