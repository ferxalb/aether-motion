<!-- Statistic card (520x300) whose number counts up from `from` to `to` with a suffix such as % or K. Set left, top, and delay (seconds); counter-delay waits that long after the card starts. -->
<style>
  @keyframes {{id|counter}}-in {
    from { transform: translate(0, 40px); opacity: 0; }
    to { transform: translate(0, 0); opacity: 1; }
  }
  #{{id|counter}} { position: absolute; left: {{left|200}}px; top: {{top|390}}px; width: 520px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border-radius: 36px; background: var(--panel, #ffffff1a); border: 2px solid var(--line, #ffffff40); backdrop-filter: blur(36px); box-shadow: 0 30px 80px 0 #00000066; animation: {{id|counter}}-in 0.8s ease-out {{delay|0}}s 1 both; }
  .{{id|counter}}-value { font-size: 150px; font-weight: 800; color: var(--accent, #4be0b8); text-align: center; }
  .{{id|counter}}-label { font-size: 30px; color: var(--muted, #8fa3c4); text-align: center; }
</style>
<div id="{{id|counter}}">
  <div class="{{id|counter}}-value" data-hf-counter="{{to|98}}" data-hf-counter-from="{{from|0}}" data-hf-counter-duration="{{count-seconds|2}}" data-hf-counter-delay="{{counter-delay|0.4}}" data-hf-counter-decimals="{{decimals|0}}" data-hf-counter-prefix="{{prefix|}}" data-hf-counter-suffix="{{suffix|%}}"></div>
  <div class="{{id|counter}}-label">{{label|of frames reused}}</div>
</div>
