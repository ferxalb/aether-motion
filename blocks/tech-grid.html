<!-- Perspective grid backdrop for a 1920x1080 composition: a glowing floor grid that scrolls toward the horizon under a soft horizon light, drawn by a native procedural shader. Put it first in the root. Colors follow the theme's --bg and --accent; speed is grid cells per second and horizon the height of the horizon (0 top, 1 bottom). -->
<div id="{{id|grid}}" data-hf-shader="
  let y = uv.y - horizon;
  let depth = 0.3 / max(y, 0.003);
  let g = vec2((uv.x - 0.5) * aspect * depth * 3.0, depth * 3.0 + t * speed);
  let d = abs(fract(g + 0.5) - 0.5);
  let w = 0.02 * depth + 0.012;
  let lines = max(smoothstep(w, 0.0, d.x), smoothstep(w * 1.3, 0.0, d.y));
  let fade = step(0.0, y) * smoothstep(0.0, 0.2, y) * (0.35 + 0.65 * smoothstep(0.0, 0.6, y));
  let pulse = 0.65 + 0.35 * smoothstep(0.7, 1.0, sin(g.y * 0.35 - t * 2.0));
  let halo = exp(-abs(y) * 11.0) * 0.55 + exp(-abs(y) * 3.0) * 0.12;
  let sky = mix(base * 0.7, base * 1.6, smoothstep(0.0, horizon, uv.y));
  rgb(sky + line * lines * fade * pulse + line * halo)
" data-hf-shader-resolution="0.5" data-hf-shader-uniforms='{"line": "var(--accent, #4be0b8)", "base": "var(--bg, #070b16)", "speed": {{speed|0.6}}, "horizon": {{horizon|0.52}}}' style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;"></div>
