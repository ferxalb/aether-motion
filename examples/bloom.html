<!-- Localized bloom: bright pixels of one element glow over a sharp background; the halo pulses with keyframes. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bloom</title>
<style>
  #root { background: #050505; }
  .clip { position: absolute; }
  /* A static grid stays untouched by the halo of the elements drawn above it. */
  .grid { left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(to bottom, #0b0b0b, #030303); }
  .rule { position: absolute; left: 160px; width: 1600px; height: 1px; background: #ffffff1f; }
  #title { left: 160px; top: 380px; width: 1600px; font-size: 150px; font-weight: 800; color: #ffffff; text-align: center; letter-spacing: 10px; }
  #ring { left: 860px; top: 680px; width: 200px; height: 200px; border: 6px solid #ffffff; border-radius: 100px; }
  #dim { left: 160px; top: 920px; width: 1600px; font-size: 34px; color: #7a7a7a; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="bloom" data-width="1920" data-height="1080" data-duration="4">
  <div class="clip grid" data-start="0" data-duration="4" data-track-index="0">
    <div class="rule" style="top: 300px"></div>
    <div class="rule" style="top: 640px"></div>
  </div>
  <!-- Pixels above 55% luminance glow with a 60 px radius; the intensity rises, then settles. -->
  <div id="title" class="clip" data-start="0" data-duration="4" data-track-index="1"
       data-hf-bloom="1.4" data-hf-bloom-threshold="0.55" data-hf-bloom-radius="60"
       data-hf-keyframes='[{"at":0,"bloom":0},{"at":1.2,"bloom":2.2,"easing":"ease-out-cubic"},{"at":3.6,"bloom":1.2,"easing":"ease-in-out"}]'>AETHER</div>
  <!-- A tinted halo: the glow takes a warm white from the tint. -->
  <div id="ring" class="clip" data-start="0.5" data-duration="3.5" data-track-index="1"
       data-hf-bloom="2" data-hf-bloom-radius="36" data-hf-bloom-tint="#ffe9c9"></div>
  <!-- Gray text is under the threshold, so it casts no halo. -->
  <div id="dim" class="clip" data-start="0" data-duration="4" data-track-index="1"
       data-hf-bloom="2" data-hf-bloom-threshold="0.6">Dim pixels under the threshold stay unchanged.</div>
</div>
</body>
</html>
