<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  #root { background: #0b1020; }
  .clip { position: absolute; }
  #scene { left: 0; top: 0; width: 1920px; height: 1080px; }
  .card { width: 560px; height: 320px; background: linear-gradient(135deg, #1f2a5a, #3a1f6b); border-radius: 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
  #a { left: 200px; top: 200px; }
  #b { left: 1160px; top: 560px; }
  .label { left: 40px; top: 120px; width: 480px; color: #ffffff; font-size: 54px; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="camera-demo" data-width="1920" data-height="1080" data-duration="6">
  <!-- Camera: wide shot, push in on card A, glide across to card B, pull back out. -->
  <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0"
       data-hf-camera='[
         {"at":0,"zoom":1},
         {"at":1.5,"zoom":1.8,"x":-480,"y":-200,"easing":"ease-out-expo"},
         {"at":3,"zoom":1.8,"x":480,"y":200,"easing":"ease-in-out-cubic"},
         {"at":5.5,"zoom":1,"x":0,"y":0,"easing":"ease-out-back"}
       ]'>
    <div id="a" class="clip card" data-start="0" data-duration="6" data-track-index="1">
      <div class="clip label" data-start="0" data-duration="6" data-track-index="2">Capture</div>
    </div>
    <div id="b" class="clip card" data-start="0" data-duration="6" data-track-index="1">
      <div class="clip label" data-start="0" data-duration="6" data-track-index="2">Ship</div>
    </div>
  </div>
</div>
</body>
</html>
