<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Captions</title>
<style>
  #root { background: #0b1020; }
  .clip { position: absolute; }
  /* The host needs an explicit box; cue rows sit at its top edge and follow its text-align. */
  #subs { left: 160px; top: 820px; width: 1600px; height: 120px; color: #ffffff;
          font-size: 72px; font-weight: 800; text-align: center; text-shadow: 0 4px 12px #000000aa; }
  #title { left: 160px; top: 300px; width: 1600px; color: #8fa3c4; font-size: 56px; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="5">
  <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Word-by-word captions</div>
  <!-- Times in transcript.json are seconds from this clip's start. SRT and VTT files work too. -->
  <div id="subs" class="clip" data-start="0" data-duration="5" data-track-index="1"
       data-hf-captions="captions/transcript.json" data-hf-captions-highlight="#4be0b8"></div>
</div>
</body>
</html>
