<!-- The Morning Shift — Into the Shadows. Native layered animation with a common street and walk phase.
     Shot changes are hidden: a foreground column carries a native wipe at 5 s, and a lamp-lit fog veil covers a
     short crossfade at 10 s. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Morning Shift — Into the Shadows</title>
<style>
  .camera, .shot { width: 1600px; height: 900px; }
  .shot { position: absolute; left: 0px; top: 0px; }
  .plate, .walk, .layer, .rain, .tile { position: absolute; }
  .dawn { left: -32px; top: -18px; width: 1664px; height: 936px; }
  .smoke { left: 528px; top: -18px; width: 1104px; height: 291px; }
  .stacks { left: 528px; top: 92px; width: 948px; height: 370px; }

  .mills { left: 245px; top: 72px; width: 1387px; height: 607px; }
  .mist-high { left: 388px; top: 239px; width: 1244px; height: 363px; opacity: .70; }
  .street { left: -32px; top: 632px; width: 1664px; height: 345px; }
  .bridges { left: 224px; top: -18px; width: 1408px; height: 667px; }
  .foundry-right { left: 1150px; top: 46px; width: 482px; height: 824px; }
  .mist-street { left: 329px; top: 522px; width: 1303px; height: 215px; opacity: .72; }
  .foundry-left { left: -32px; top: -18px; width: 555px; height: 936px; }
  .sidewalk { left: -32px; top: 627px; width: 956px; height: 351px; }
  .lampworks { left: 275px; top: 376px; width: 1213px; height: 421px; }
  .first-air { left: 196px; top: 423px; width: 448px; height: 427px; opacity: .78; }
  .first-bulb { left: 386px; top: 447px; width: 80px; height: 10px; border-radius: 5px; background: #f2f2f2; }
  .canopy { left: -35px; top: 120px; width: 830px; height: 671px; }
  .pavement { left: 425px; top: 650px; width: 593px; height: 144px; }
  .last-lamp { left: 742px; top: 425px; width: 140px; height: 314px; }
  .last-air { left: 681px; top: 464px; width: 324px; height: 326px; }
  .last-bulb { left: 816px; top: 498px; width: 53px; height: 6px; border-radius: 3px; background: #fdfdfd; }
  .rain { left: -64px; top: -182px; width: 1696px; height: 1250px; }
  .tile { width: 848px; height: 625px; }
  .rain-far { opacity: .42; animation: far-rain .72s linear infinite; }
  .rain-near { opacity: .72; animation: near-rain .43s linear infinite; }
  .walk { width: var(--body-w); height: var(--body-h);
          animation: var(--walk-track) var(--walk-time, 5s) var(--walk-steps, steps(60, jump-end)) forwards; }
  .walk img { width: 100%; height: 100%; }
  .walk img.sole { top: 89.015%; height: 10.985%; }
  .walk .sole { position: absolute; }
  .old-key { left: 268px; top: 535px; width: 414px; height: 293px;
             mask-image: linear-gradient(to right, black 10%, black 38%, #000000a9 68%, transparent 99%); }
  .side-wall { width: 1900px; height: 692px; }
  .side-ground { top: 666px; width: 1900px; height: 264px; }
  .side-steel { left: -20px; width: 1544px; height: 771px; }
  .side-key { left: 510px; top: 406px; width: 450px; height: 351px;
              mask-image: linear-gradient(to right, black 12%, #000000db 36%, #00000071 59%, transparent 82%); }
  .side-haze { left: 1050px; top: 465px; width: 750px; height: 300px;
               background: radial-gradient(ellipse farthest-side, #bdbdbd45, #bdbdbd20 45%, transparent); }
  .canopy-shade { width: 1500px; height: 752px;
                  background: linear-gradient(to right, #1010103e, #0c0c0c48 50%, #11111118 75%, transparent); }
  .yard-wall { width: 1900px; height: 715px; }
  .yard-paving { top: 568px; width: 1900px; height: 362px; }
  .yard-lamp { left: 690px; top: 239px; width: 220px; height: 505px; }
  .yard-air { left: 579px; top: 316px; width: 537px; height: 507px; opacity: .68; }
  .yard-bulb { left: 809px; top: 358px; width: 79px; height: 9px; border-radius: 4px; background: #ebebeb; }
  .yard-pool { left: 632px; top: 663px; width: 443px; height: 176px;
               background: radial-gradient(ellipse farthest-side, #d0d0d052, #bbbbbb28 47%, transparent); }
  .yard-key { left: 642px; top: 355px; width: 461px; height: 405px;
              mask-image: linear-gradient(to right, transparent 12%, #00000048 27%, #000000e3 43%, black 48%, #0000008c 60%, transparent 85%); }
  .yard-mirror { left: 656px; top: 719px; width: 414px; height: 143px;
                 mask-image: radial-gradient(ellipse farthest-side, black, #000000a9 40%, transparent);
                 opacity: .34; }
  .walk.reflection { height: 108px; }
  .yard-haze { left: 888px; top: 360px; width: 830px; height: 480px;
               background: radial-gradient(ellipse farthest-side, #c2c2c286, #b4b4b461 52%, transparent); }
  .near-haze { left: 883px; top: 554px; width: 780px; height: 252px;
               background: radial-gradient(ellipse farthest-side, #c3c3c37a, #b4b4b437 46%, transparent); }
  .lamp-rain { left: 683px; top: 365px; width: 338px; height: 352px;
               mask-image: radial-gradient(ellipse farthest-side, black, #00000097 53%, transparent); }
  .lamp-rain img { width: 338px; height: 430px; top: -54px; opacity: .48;
                   animation: lamp-rain .67s linear infinite; }
  /* Cut 1: a near-lens steel column crosses at the wipe's speed; the wipe edge stays inside its dark core. */
  .column { left: 0px; top: -40px; width: 620px; height: 980px;
            background: linear-gradient(to right, transparent, #00000066 11%, #0b0b0b 20%, #2a2a2a 25%, #141414 33%, #090909 55%, #050505 80%, #00000066 89%, transparent); }
  /* Cut 2: fog thickens around the lamp, holds over the cut, and thins into the lamp yard. */
  .fog { width: 1600px; height: 900px; }
  .fog-veil { left: -40px; top: -40px; width: 1680px; height: 980px;
              background: radial-gradient(ellipse farthest-corner at 53% 40%, #8d8d8d, #5c5c5c 24%, #3d3d3d 55%, #262626); }
  .fog-glow { left: 590px; top: 170px; width: 520px; height: 400px;
              background: radial-gradient(ellipse farthest-side, #bdbdbd8a, #a8a8a838 48%, transparent); }
  .fog-bank { left: -120px; top: 120px; width: 1900px; height: 660px; opacity: .9; }
  .blackout { width: 1600px; height: 900px; background: #000; }
  /* The city walk runs past 5 s at the same 3.75 px per cel so the walker keeps moving behind the column. */
  #city { --body-w: 131.25px; --body-h: 198px; --walk-track: city-walk; --walk-time: 5.5s; --walk-steps: steps(66, jump-end); }
  #shadow { --body-w: 196px; --body-h: 295.68px; --walk-track: shadow-walk; --walk-time: 5.5s; --walk-steps: steps(66, jump-end); }
  #light { --body-w: 245px; --body-h: 369.6px; --walk-track: light-walk; }
  @keyframes city-walk { from { transform: translate(0px, 0px); } to { transform: translate(247.5px, 0px); } }
  @keyframes shadow-walk { from { transform: translate(0px, 0px); } to { transform: translate(369.6px, 0px); } }
  @keyframes light-walk { from { transform: translate(0px, 0px); } to { transform: translate(420px, 0px); } }
  @keyframes far-rain { from { transform: translate(19px, -52px); } to { transform: translate(-14px, 110px); } }
  @keyframes near-rain { from { transform: translate(30px, -86px); } to { transform: translate(-29px, 145px); } }
  @keyframes lamp-rain { from { transform: translate(5px, -8px); } to { transform: translate(-7px, 40px); } }
</style>
</head>
<body>
<div data-composition-id="the-morning-shift-into-the-shadows" data-width="1600" data-height="900" data-duration="15"
     data-hf-exposure=".14" data-hf-highlight-rolloff=".49" data-hf-shadow-toe=".24"
     data-hf-grain=".084" data-hf-vignette=".39" style="background:#151515; filter: grayscale(1) contrast(1.10);">
  <!-- The City, 0–5 seconds; it runs 0.4 s longer under the wipe, with every drift continuing at its own rate. -->
  <div id="city-shot" class="clip shot" data-start="0" data-duration="5.4" data-track-index="1">
  <img class="plate dawn" src="cinematic-assets/dawn.svg" alt="">
  <section id="city" class="camera"
      data-hf-camera='[{"at":0,"x":-14,"y":8},{"at":5.5,"x":9.1,"y":12.4}]'>
    <img class="plate smoke" src="cinematic-assets/smoke.svg" data-hf-parallax="0.34" alt="" data-hf-keyframes='[{"at":0,"x":-17,"y":2},{"at":5.5,"x":5,"y":-4.6}]'>
    <img class="plate stacks" src="cinematic-assets/stacks.svg" data-hf-parallax="0.36" alt="">
    <img class="plate horizon" src="cinematic-assets/horizon.svg" data-hf-parallax="0.25" alt="">
    <img class="plate mills" src="cinematic-assets/mills.svg" data-hf-parallax="0.46" alt="">
    <img class="plate mist-high" src="cinematic-assets/upper-mist.svg" data-hf-parallax="0.48" alt="" data-hf-keyframes='[{"at":0,"x":-40},{"at":5.5,"x":-7,"y":-6.6}]'>
    <img class="plate street" src="cinematic-assets/wet-street.svg" data-hf-parallax="1.14" alt="">
    <img class="plate bridges" src="cinematic-assets/viaducts.svg" data-hf-parallax="1.00" alt="">

    <img class="plate mist-street" src="cinematic-assets/street-mist.svg" data-hf-parallax="0.83" alt="" data-hf-keyframes='[{"at":0,"x":25},{"at":5.5,"x":-2.5,"y":-5.5}]'>
    <img class="plate foundry-left" src="cinematic-assets/foundry-left.svg" data-hf-parallax="1.15" alt="">
    <img class="plate sidewalk" src="cinematic-assets/sidewalk.svg" data-hf-parallax="1.14" alt="">
    <img class="plate pavement" src="cinematic-walk-assets/shadow-pavement.svg" data-hf-parallax="1.14" alt="">
    <img class="plate first-air" src="cinematic-assets/lamp-air.svg" data-hf-parallax="1.14" alt="">
    <img class="plate lampworks" src="cinematic-assets/lampworks.svg" data-hf-parallax="1.14" alt="">
    <img class="plate last-air" src="cinematic-walk-assets/last-air.svg" data-hf-parallax="1.14" alt="">
    <div class="layer first-bulb" data-hf-parallax="1.14" data-hf-bloom="1.35" data-hf-bloom-radius="54"></div>
    <div class="rain rain-far" data-hf-parallax="0.66">
      <img class="tile" style="left:0px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:0px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
    </div>
    <div class="walk" style="left:276.0px;top:592px" data-hf-parallax="1.14"><img class="sole" data-hf-sequence="cinematic-walk-assets/contact/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""><img data-hf-sequence="cinematic-walk-assets/shadow/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    <div class="layer old-key" data-hf-parallax="1.14">
      <div class="walk" style="left:8px;top:57px"><img data-hf-sequence="cinematic-walk-assets/lit/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    </div>
    <!-- The pillar and lamppost sit in front of the walker and share his world-plane pan. -->
    <img class="plate canopy" src="cinematic-walk-assets/canopy.svg" data-hf-parallax="1.14" alt="">
    <img class="plate last-lamp" src="cinematic-walk-assets/last-lamp.svg" data-hf-parallax="1.14" alt="">
    <div class="layer last-bulb" data-hf-parallax="1.14" data-hf-bloom="1.35" data-hf-bloom-radius="68"></div>
    <div class="rain rain-near" data-hf-parallax="1.37">
      <img class="tile" style="left:0px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:0px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
    </div>
  </section>
  </div>
  <!-- Into the Shadows. Side elevation, tracking parallel to the loading dock. It starts on the
       city's walk phase and is uncovered from the right while a foreground column hides the edge. -->
  <div id="shadow-shot" class="clip shot" data-start="5" data-duration="5.14" data-track-index="2"
       data-hf-transition="wipe-left" data-hf-transition-from="city-shot" data-hf-transition-easing="linear">
  <section id="shadow" class="camera"
      data-hf-camera='[{"at":0,"x":12},{"at":5.5,"x":271.6}]'>
    <img class="plate side-wall" src="cinematic-walk-assets/track-wall.svg" data-hf-parallax="0.95" alt="">
    <img class="plate side-ground" src="cinematic-walk-assets/track-ground.svg" data-hf-parallax="1" alt="">
    <div class="layer canopy-shade" data-hf-parallax="1"></div>
    <div class="layer side-haze" data-hf-parallax="0.67"
         data-hf-keyframes='[{"at":0,"x":20},{"at":5.5,"x":-25.1}]'></div>
    <div class="rain rain-far" data-hf-parallax="0.68" style="top:-229px; opacity:.24">
      <img class="tile" style="left:0px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:0px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
    </div>
    <div class="walk" style="left:578px;top:446px" data-hf-parallax="1"><img class="sole" data-hf-sequence="cinematic-walk-assets/contact/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""><img data-hf-sequence="cinematic-walk-assets/shadow/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    <div class="layer side-key" data-hf-parallax="1">
      <div class="walk" style="left:68px;top:40px"><img data-hf-sequence="cinematic-walk-assets/lit/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    </div>
    <!-- The riveted pillar sits in front of the actor; both share the ground-plane pan. -->
    <img class="plate side-steel" src="cinematic-walk-assets/track-steel.svg" data-hf-parallax="1" alt="">
    <div class="rain rain-near" data-hf-parallax="1.19" style="opacity:.47">
      <img class="tile" style="left:0px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:0px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
    </div>
  </section>
  </div>
  <!-- The column: a near-lens pillar of the loading dock crossing at 4000 px/s, the wipe edge on its center line. -->
  <div class="clip layer column" data-start="4.8" data-duration="0.8" data-track-index="10"
       data-hf-motion-blur="on" data-hf-motion-blur-samples="12"
       data-hf-keyframes='[{"at":0,"x":2090},{"at":0.8,"x":-1110}]'></div>
  <!-- The Last Light. Reverse oblique down the lamp yard, with the lamp ahead of the walker. -->
  <div id="light-shot" class="clip shot" data-start="10" data-duration="5" data-track-index="3"
       data-hf-transition="crossfade" data-hf-transition-from="shadow-shot" data-hf-transition-easing="ease-in-out">
  <section id="light" class="camera"
      data-hf-camera='[{"at":0,"x":4},{"at":5,"x":109}]'>
    <img class="plate yard-wall" src="cinematic-walk-assets/lamp-yard.svg" data-hf-parallax="0.92" alt="">
    <img class="plate yard-paving" src="cinematic-walk-assets/lamp-ground.svg" data-hf-parallax="1" alt="">
    <div class="layer yard-haze" data-hf-parallax=".78"
         data-hf-keyframes='[{"at":0,"x":15,"opacity":0.78},{"at":5,"x":-32,"opacity":1}]'></div>
    <div class="layer yard-pool" data-hf-parallax="1"></div>
    <img class="plate yard-air" src="cinematic-walk-assets/last-air.svg" data-hf-parallax="1" alt="">
    <div class="rain rain-far" data-hf-parallax="0.62">
      <img class="tile" style="left:0px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:0px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
    </div>
    <div class="layer lamp-rain" data-hf-parallax="1">
      <img class="plate" src="cinematic-assets/lamp-drizzle.svg" alt="">
    </div>
    <div class="layer yard-mirror" data-hf-parallax="1">
      <div class="walk reflection" style="left:-138px;top:15px"><img data-hf-sequence="cinematic-walk-assets/reflection/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    </div>
    <div class="walk" style="left:518px;top:383px" data-hf-parallax="1"><img class="sole" data-hf-sequence="cinematic-walk-assets/contact/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""><img data-hf-sequence="cinematic-walk-assets/shadow/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    <div class="layer yard-key" data-hf-parallax="1">
      <div class="walk" style="left:-124px;top:28px"><img data-hf-sequence="cinematic-walk-assets/lit/cel-{frame:02}.png" data-hf-sequence-first="1" data-hf-sequence-fps="12" data-hf-sequence-playback="loop" alt=""></div>
    </div>
    <div class="layer near-haze" data-hf-parallax="0.87"
         data-hf-keyframes='[{"at":0,"x":28,"opacity":0.65},{"at":5,"x":-24,"opacity":1}]'></div>
    <img class="plate yard-lamp" src="cinematic-walk-assets/last-lamp.svg" data-hf-parallax="1" alt="">
    <div class="layer yard-bulb" data-hf-parallax="1" data-hf-bloom="1.28" data-hf-bloom-radius="56"></div>
    <div class="rain rain-near" data-hf-parallax="1.21" style="opacity:.57">
      <img class="tile" style="left:0px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:0px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:0px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:848px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
      <img class="tile" style="left:1696px;top:625px" src="cinematic-assets/rain-2.svg" alt="">
    </div>
  </section>
  </div>
  <!-- Fog rolls across the dock and the lamp glows through it; the shots crossfade only inside its dense
       hold (10.00-10.14 s), then it thins into the lamp yard. -->
  <div class="clip fog" data-start="9.84" data-duration="0.44" data-track-index="10"
       data-hf-keyframes='[{"at":0,"opacity":0},{"at":0.15,"opacity":0.9,"easing":"ease-in-out"},{"at":0.27,"opacity":0.9},{"at":0.44,"opacity":0,"easing":"ease-in-out"}]'>
    <div class="layer fog-veil" data-hf-keyframes='[{"at":0,"x":24},{"at":0.44,"x":-24}]'></div>
    <img class="layer fog-bank" src="cinematic-assets/upper-mist.svg" alt="" data-hf-keyframes='[{"at":0,"x":60},{"at":0.44,"x":-60}]'>
    <div class="layer fog-glow" data-hf-bloom="0.9" data-hf-bloom-radius="60"
         data-hf-keyframes='[{"at":0,"opacity":0.35},{"at":0.3,"opacity":1,"easing":"ease-out"}]'></div>
  </div>
  <div class="clip blackout" data-start="13.93" data-duration="1.07" data-track-index="20"
       data-hf-keyframes='[{"at":0,"opacity":0},{"at":1.03,"opacity":1,"easing":"ease-in-out-cubic"}]'></div>
</div>
</body>
</html>
