<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0b1020;
      --card: linear-gradient(to right, #1d3855, #274a6d);
      --accent: hsl(162 70% 58%);
      --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-in {
      from { transform: translate(0, 40px) scale(0.6); opacity: 0; }
      60%  { opacity: 1; }
      to   { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes sweep {
      from { transform: translateX(-480px); opacity: 0; }
      30%  { opacity: 1; }
      to   { transform: translateX(0); opacity: 1; }
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.55; }
      to   { transform: scale(1.35); opacity: 1; }
    }

    .card {
      left: 72px; top: 76px; width: 496px; height: 168px;
      background: var(--card); border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      animation: pop-in 0.9s var(--pop) 0.2s both;
    }
    h1 { font-size: 40px; color: #f4f8ff; }
    .bar {
      left: 72px; top: 268px; width: 496px; height: 6px; border-radius: 3px;
      background: var(--accent);
      animation: sweep 0.8s ease-out 0.7s both;
    }
    .dot {
      left: 300px; top: 304px; width: 40px; height: 40px; border-radius: 20px;
      background: rgba(255, 120, 90, 0.9);
      animation: pulse 0.7s ease-in-out 1.2s infinite alternate both;
    }
  </style>
</head>
<body>
  <main data-composition-id="css-motion" data-width="640" data-height="360"
        data-duration="4" style="background: var(--bg)">
    <div class="clip card" data-start="0" data-duration="4" data-track-index="0">
      <h1>CSS, natively rendered</h1>
    </div>
    <div class="clip bar" data-start="0" data-duration="4" data-track-index="1"></div>
    <div class="clip dot" data-start="0" data-duration="4" data-track-index="2"></div>
  </main>
</body>
</html>
