<!-- Lantern Valley: a six-second demonstration of native 2.5D spaces (AETHER Motion 0.1.9).
     One perspective space holds every layer as a flat plane at its own depth: sky, moon, two ridges, a
     lake floor tilted flat (rotateX 90) that the ridges stand on (the depth order splits it where
     they meet), floating lanterns, and foreground reeds. A single camera
     trucks right and dollies 760 px into the valley, so parallax and growth come from real depth;
     the near end of the lake passes through the near clipping distance. The title card swings in on
     rotateY and carries a nested plane 60 px in front of it, which separates from the card as it
     turns. Everything is a function of time; there are no external assets. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Valley — 2.5D space</title>
<style>
  .plane { position: absolute; }
  #valley { position: absolute; left: 0px; top: 0px; width: 1920px; height: 1080px; }
  /* Overscanned for the widest view: depth shrinks far planes, and the camera trucks 300 px. */
  #sky { left: -3640px; top: -2160px; width: 9200px; height: 5000px;
         background: linear-gradient(to bottom, #060a20 0%, #121844 30%, #35346a 47%, #a8737c 56%, #f2b38c 60.5%, #b77a78 66%, #b77a78 100%); }
  #moon { left: 2400px; top: -720px; width: 520px; height: 520px; border-radius: 260px;
          background: radial-gradient(circle farthest-side, #fffaf0 0%, #fde9c8 40%, rgba(253, 226, 186, 0.32) 46%, rgba(253, 226, 186, 0) 100%); }
  #haze { left: -2540px; top: 540px; width: 7000px; height: 500px;
          background: linear-gradient(to bottom, rgba(240, 170, 140, 0) 0%, rgba(240, 170, 140, 0.30) 55%, rgba(240, 170, 140, 0) 100%); }
  #far-ridge { left: -2240px; top: 170px; width: 6400px; height: 700px; }
  #mid-ridge { left: -1440px; top: 230px; width: 4800px; height: 640px; }
  /* The lake lies flat (rotateX 90) at y = 330 px, from z = -3200 (its top edge) to z = 800. */
  #lake { left: -2840px; top: -1130px; width: 7600px; height: 4000px;
          background: linear-gradient(to bottom, #b77a78 0%, #946466 20%, #63454c 47.5%, #070a1c 100%); }
  .lantern { position: absolute; width: 34px; height: 50px; border-radius: 10px;
             background: linear-gradient(to bottom, #fff3c8, #ffb45a); }
  #reeds-left { left: -490px; top: 170px; width: 900px; height: 700px; }
  #reeds-right { left: 1560px; top: 170px; width: 900px; height: 700px; }
  #card { left: 540px; top: 310px; width: 980px; height: 300px; border-radius: 26px;
          background: rgba(9, 12, 34, 0.74); border: 2px solid rgba(255, 214, 160, 0.55);
          box-shadow: 0px 30px 80px rgba(0, 0, 0, 0.45); }
  #title { position: absolute; left: 0px; top: 58px; width: 980px; font-size: 92px; font-weight: 700;
           letter-spacing: 14px; color: #ffe7c2; text-align: center; line-height: 1.15; }
  #tag { position: absolute; left: 250px; top: 212px; width: 480px; height: 56px; border-radius: 28px;
         background: #ffb45a; box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.35); }
  #tag p { position: absolute; left: 0px; top: 13px; width: 480px; font-size: 26px; font-weight: 600;
           letter-spacing: 3px; color: #1a1230; text-align: center; }
</style>
</head>
<body>
<div data-composition-id="lantern-valley" data-width="1920" data-height="1080" data-duration="6"

    <div class="lantern" data-hf-bloom="1.6" data-hf-bloom-radius="30" data-hf-z="-1500" style="left:1243px; top:575px"

    <div class="lantern" data-hf-bloom="1.6" data-hf-bloom-radius="30" data-hf-z="-600" style="left:1463px; top:655px"
         data-hf-keyframes='[{"at":0,"y":0},{"at":6,"y":-70,"easing":"ease-in-out"}]'></div>
    <div class="lantern" data-hf-bloom="1.6" data-hf-bloom-radius="30" data-hf-z="-200" style="left:243px; top:715px"
         data-hf-keyframes='[{"at":0,"y":0},{"at":6,"y":-55,"easing":"ease-in-out"}]'></div>
    <div class="lantern" data-hf-bloom="1.6" data-hf-bloom-radius="30" data-hf-z="100" style="left:493px; top:745px"
         data-hf-keyframes='[{"at":0,"y":0},{"at":6,"y":-65,"easing":"ease-in-out"}]'></div>
    <!-- The title card swings in on rotateY; the tag is a nested plane 60 px in front of it. -->
    <div id="card" class="plane clip" data-start="3.1" data-duration="2.9" data-hf-fade-in="0.5"
         data-hf-z="-760" data-hf-keyframes='[{"at":0,"z":-980,"rotateY":-68},{"at":1.8,"z":-760,"rotateY":0,"easing":"ease-out-cubic"}]'>
      <h1 id="title" data-hf-split="chars" data-hf-stagger="0.035" data-hf-split-duration="0.7" data-hf-split-distance="40">LANTERN VALLEY</h1>
      <div id="tag" data-hf-z="60">
        <p>NATIVE 2.5D · ONE CAMERA</p>
      </div>
    </div>
    <svg id="reeds-left" class="plane" data-hf-z="150" width="900" height="700" viewBox="0 0 900 700" preserveAspectRatio="none">
      <path d="M36 700 Q39 425 29 200 Q44 425 50 700 Z M108 700 Q121 491 131 320 Q128 491 126 700 Z M157 700 Q181 403 210 160 Q189 403 179 700 Z M235 700 Q225 469 186 280 Q231 469 249 700 Z M284 700 Q285 381 265 120 Q292 381 302 700 Z M333 700 Q344 447 344 240 Q353 447 355 700 Z M411 700 Q426 359 446 80 Q432 359 425 700 Z M460 700 Q486 425 525 200 Q493 425 478 700 Z M509 700 Q507 491 478 320 Q516 491 531 700 Z M587 700 Q590 403 580 160 Q595 403 601 700 Z M636 700 Q649 469 659 280 Q656 469 654 700 Z M708 700 Q732 381 761 120 Q740 381 730 700 Z M763 700 Q753 447 714 240 Q759 447 777 700 Z M812 700 Q813 359 793 80 Q820 359 830 700 Z" fill="#03050e"/>

</div>
