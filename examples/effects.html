<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Effects: grade, blend, drop shadow, motion blur</title>
<style>
  #root { background: #0d1020; filter: contrast(1.08) saturate(1.15); }
  .clip { position: absolute; }
  #photo { left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(135deg, #ff7a59 0%, #6b5bff 55%, #19c2a0 100%); }
  #stripes { left: 160px; top: 230px; width: 760px; height: 640px; border-radius: 48px; background: linear-gradient(to bottom, #ffffff, #2a2a2a); mix-blend-mode: multiply; }
  #halo { left: 1000px; top: 230px; width: 760px; height: 640px; background: radial-gradient(ellipse farthest-side at 50% 50%, #ffd27a, rgba(255, 210, 122, 0)); mix-blend-mode: screen; }
  #logo { left: 760px; top: 340px; width: 400px; height: 400px; filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.55)); }
  #mono { left: 1340px; top: 820px; width: 420px; height: 140px; border-radius: 24px; background: #ff4f7b; filter: grayscale(1) brightness(1.2); }
  #puck { left: 120px; top: 900px; width: 120px; height: 120px; border-radius: 60px; background: #ffffff; }
  .title { left: 0; top: 130px; width: 1920px; color: #ffffff; font-size: 64px; font-weight: 800; text-align: center; mix-blend-mode: difference; }
</style>
</head>
<body>
<!-- Root filter grades every frame; mix-blend-mode blends with what is behind; drop-shadow follows the
     logo's shape; data-motion-blur smears the fast puck over a 180-degree shutter. -->
<div id="root" data-composition-id="effects" data-width="1920" data-height="1080" data-duration="3"
     data-motion-blur="on" data-motion-blur-shutter="180">
  <div id="photo" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
  <div id="stripes" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
  <div id="halo" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
  <img id="logo" class="clip" src="assets/logo.svg" data-start="0" data-duration="3" data-track-index="2">
  <div id="mono" class="clip" data-start="0" data-duration="3" data-track-index="2"></div>
  <div id="puck" class="clip" data-start="0" data-duration="3" data-track-index="3"
       data-hf-keyframes='[{"at":0,"x":0},{"at":1.2,"x":1500,"easing":"ease-in-out-cubic"},{"at":3,"x":1500}]'></div>
  <div class="clip title" data-start="0" data-duration="3" data-track-index="4">Grade · Blend · Drop shadow · Motion blur</div>
</div>
</body>
</html>
