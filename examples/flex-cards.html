<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0b1020;
      --panel: #16213a;
      --accent: hsl(162 70% 58%);
      --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes rise {
      from { transform: translate(0, 36px) scale(0.85); opacity: 0; }
      to   { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    .stage {
      left: 0; top: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 28px; padding: 32px;
    }
    h1 { font-size: 44px; color: #f4f8ff; animation: rise 0.7s ease-out both; }
    .row { display: flex; gap: 24px; }
    .card {
      width: 168px; height: 150px; border-radius: 16px; background: var(--panel);
      box-shadow: 0 14px 26px 0 rgba(0, 0, 0, 0.55);
      border: 2px solid hsla(162, 70%, 58%, 0.35);
      display: flex; flex-direction: column; justify-content: space-between; padding: 16px;
      animation: rise 0.7s var(--pop) both;
    }
    .card.a { animation-delay: 0.25s; }
    .card.b { animation-delay: 0.45s; }
    .card.c { animation-delay: 0.65s; }
    .dot { width: 22px; height: 22px; border-radius: 11px; background: var(--accent);
           box-shadow: 0 0 14px 2px hsla(162, 70%, 58%, 0.7); }
    .label { font-size: 22px; color: #cfe0ff; }
    .bar { height: 8px; border-radius: 4px; background: var(--accent); flex-grow: 0; }
  </style>
</head>
<body>
  <main data-composition-id="flex-cards" data-width="640" data-height="360"
        data-duration="3" style="background: var(--bg)">
    <div class="clip stage" data-start="0" data-duration="3" data-track-index="0">
      <h1 class="clip" data-start="0" data-duration="3">Flex layout, natively</h1>
      <div class="clip row" data-start="0" data-duration="3">
        <div class="clip card a" data-start="0" data-duration="3">
          <div class="clip dot" data-start="0" data-duration="3"></div>
          <div class="clip label" data-start="0" data-duration="3">Render</div>
        </div>
        <div class="clip card b" data-start="0" data-duration="3">
          <div class="clip dot" data-start="0" data-duration="3"></div>
          <div class="clip label" data-start="0" data-duration="3">Layout</div>
        </div>
        <div class="clip card c" data-start="0" data-duration="3">
          <div class="clip dot" data-start="0" data-duration="3"></div>
          <div class="clip label" data-start="0" data-duration="3">Motion</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
