<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light, focus, and glitch transitions</title>
<style>
  #root { background: #05070f; }
  .clip { position: absolute; }
  .scene { left: 0; top: 0; width: 1920px; height: 1080px; }
  #s1 { background: linear-gradient(135deg, #1f2a5a, #3a1f6b); }
  #s2 { background: linear-gradient(135deg, #0f4c4a, #1c7a64); }
  #s3 { background: linear-gradient(135deg, #5a1f3a, #a8402f); }
  #s4 { background: linear-gradient(135deg, #20232b, #4a5160); }
  #s5 { background: linear-gradient(135deg, #3d2a08, #b07a16); }
  #s6 { background: linear-gradient(135deg, #081f3d, #1660b0); }
  #s7 { background: linear-gradient(135deg, #2b0f3d, #7a1fa8); }
  .title { position: absolute; left: 160px; top: 440px; width: 1600px; color: #ffffff; font-size: 140px; font-weight: 800; text-align: center; }
</style>
</head>
<body>
<!-- Each scene starts 0.8 s before the previous one ends; that overlap is the transition. -->
<div id="root" data-composition-id="light-transitions" data-width="1920" data-height="1080" data-duration="15.2">
  <div id="s1" class="clip scene" data-start="0" data-duration="2.8" data-track-index="0">
    <div class="title" data-track-index="1">Dip to black</div>
  </div>
  <div id="s2" class="clip scene" data-start="s1-0.8" data-duration="2.8" data-track-index="1"
       data-hf-transition="dip-to-black" data-hf-transition-from="s1">
    <div class="title" data-track-index="1">Dip to white</div>
  </div>
  <div id="s3" class="clip scene" data-start="s2-0.8" data-duration="2.8" data-track-index="2"
       data-hf-transition="dip-to-white" data-hf-transition-from="s2">
    <div class="title" data-track-index="1">Flash</div>
  </div>
  <div id="s4" class="clip scene" data-start="s3-0.8" data-duration="2.8" data-track-index="3"
       data-hf-transition="flash" data-hf-transition-from="s3">
    <div class="title" data-track-index="1">Blur</div>
  </div>
  <div id="s5" class="clip scene" data-start="s4-0.8" data-duration="2.8" data-track-index="4"
       data-hf-transition="blur" data-hf-transition-from="s4">
    <div class="title" data-track-index="1">Whip</div>
  </div>
  <div id="s6" class="clip scene" data-start="s5-0.8" data-duration="2.8" data-track-index="5"
       data-hf-transition="whip-left" data-hf-transition-from="s5">
    <div class="title" data-track-index="1">Glitch</div>
  </div>
  <div id="s7" class="clip scene" data-start="s6-0.8" data-duration="2.8" data-track-index="6"
       data-hf-transition="glitch" data-hf-transition-from="s6">
    <div class="title" data-track-index="1"
         data-hf-keyframes='[{"at":0.9,"rgbSplit":0},{"at":1.3,"rgbSplit":14,"easing":"ease-out"},{"at":2.0,"rgbSplit":0,"easing":"ease-in-out"}]'>RGB split</div>
  </div>
</div>
</body>
</html>
