<!doctype html>
<!--
  Lighthouse Isle: a native 3D study (AETHER Motion 0.2, data-hf-3d).

  Shot plan (one continuous camera in one space, no cuts):
    0.0-4.0 s  Low and wide over the water: the camera cranes up toward the island while the
               lighthouse beam sweeps and a sailboat crosses behind the island.
    4.0-7.5 s  The crane turns into a slow orbit around the tower. The orbit carries the low sun
               across the frame until it passes behind the lamp, backlighting the faceted trees,
               rocks, and cottage.
    7.5-10 s   The move settles into a held three-quarter view with the tower right of center;
               the title enters in the open sky on the left and the frame holds to the end.
  The sky, sun glow, and title are 2D layers; everything else is low-poly geometry lit by a sky
  ambient, a warm key from the sun's direction, and a cool fill, rasterized natively and exported
  to MP4. The lantern sweeps a native volumetric shaft through the sea air. Its fixed mullion
  casts a shadow in the shaft as the lens passes it. The sky's keyframes keep the horizon band
  and the sun locked to the 3D world.
-->
<html>
<head>
<style>
  #sky { position: absolute; left: -900px; top: -540px; width: 4600px; height: 2160px;
         background: linear-gradient(to bottom, #141a3a 0%, #2b2d5e 30%, #6b4a7c 44%, #d9806a 52%, #f3b27a 56%, #f6c88e 60%, #e89a74 100%); }
  #sun { position: absolute; left: 1600px; top: 860px; width: 520px; height: 520px;
         background: radial-gradient(circle, rgba(255,236,190,1) 0%, rgba(255,214,150,0.85) 12%, rgba(255,170,110,0.25) 38%, rgba(255,150,100,0) 70%); }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .title { position: absolute; left: 192px; top: 150px; width: 900px; font-family: sans-serif; font-weight: 800;
           font-size: 104px; letter-spacing: 6px; color: #fff4e4; line-height: 1.3;
           text-shadow: 0 6px 30px rgba(30, 20, 60, 0.55); }
  .subtitle { text-shadow: 0 3px 14px rgba(30, 20, 60, 0.7); }
  .subtitle { position: absolute; left: 198px; top: 300px; width: 900px; font-family: sans-serif; font-weight: 500;
              font-size: 34px; letter-spacing: 3px; color: #ffd9b8; }
</style>
</head>
<body>

     style="position: relative; width: 1920px; height: 1080px; background: #141a3a">

       horizon and the sun stays in one world direction (the key light's) while the camera orbits. -->

       data-hf-keyframes='[{"at":0.0,"x":-1652,"y":-118},{"at":1.0,"x":-1574,"y":-129},{"at":1.5,"x":-1484,"y":-142},{"at":2.0,"x":-1368,"y":-159},{"at":2.5,"x":-1232,"y":-179},{"at":3.0,"x":-1082,"y":-201},{"at":3.5,"x":-925,"y":-222},{"at":4.0,"x":-771,"y":-237},{"at":4.5,"x":-599,"y":-248},{"at":5.0,"x":-391,"y":-259},{"at":5.5,"x":-163,"y":-270},{"at":6.0,"x":66,"y":-278},{"at":6.5,"x":280,"y":-283},{"at":7.0,"x":455,"y":-286},{"at":7.5,"x":562,"y":-286},{"at":8.0,"x":622,"y":-286},{"at":8.5,"x":675,"y":-286},{"at":9.0,"x":719,"y":-286},{"at":10.0,"x":759,"y":-286}]'>
