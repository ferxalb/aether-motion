<!doctype html>
<!-- One Night. Two external scenes share a coast and a continuous sound bed: one unbroken clifftop
     take (follow, stop, pull back) dissolves into the reverse view from the sea while both cameras
     are still pulling back. The ambience is raised 12.2 dB (x4.07) to about -26 LUFS integrated;
     its own fade-out ends the film. -->
<meta charset="utf-8">
<main data-composition-id="one-night" data-width="1920" data-height="1080" data-duration="15"
      style="background:#000" data-hf-vignette="0.24">
  <section id="clifftop" class="clip" data-composition-src="scenes/clifftop.html"
           data-start="0" data-duration="11" data-track-index="1"></section>
  <section id="night" class="clip" data-composition-src="scenes/night.html"
           data-start="clifftop-1.4" data-duration="5.4" data-track-index="2"
           data-hf-transition="crossfade" data-hf-transition-from="clifftop"
           data-hf-transition-easing="ease-in-out"></section>
  <audio src="assets/coastal-air.wav" data-start="0" data-duration="15" data-volume="4.07"></audio>
</main>
