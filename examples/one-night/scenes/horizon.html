/* Independent coastal plates and fixed-size character drawings. */
#world, .plane { width:1920px; height:1080px; position:absolute; }

.shimmer-a { animation: sheen-a 2.5s ease-in-out infinite; }
.shimmer-b { animation: sheen-b 2.5s ease-in-out infinite; }
@keyframes sheen-a {
  from { transform:translate(-5px,0px); opacity:.62; }
  50% { transform:translate(5px,2px); opacity:.91; }
  to { transform:translate(-5px,0px); opacity:.62; }
}
@keyframes sheen-b {
  from { transform:translate(4px,0px); opacity:.74; }
  50% { transform:translate(-4px,2px); opacity:.40; }
  to { transform:translate(4px,0px); opacity:.74; }
}
#man { position:absolute; }
.shadow { position:absolute; background:radial-gradient(ellipse farthest-side, #02060bbd, #05091060 42%, transparent 100%); }
.hem { animation: gust 2.5s ease-in-out infinite; }
@keyframes gust {
  from { transform:translate(-4px,0px); }
  40% { transform:translate(4px,-3px); }
  74% { transform:translate(1px,0px); }
  to { transform:translate(-4px,0px); }
}
/* Weight follows the stance leg: lowest in double support, highest and
   shifted over the planted foot at mid-stance. */
 .weight { animation: shoulders .94s linear infinite; }
@keyframes shoulders {
  0% { transform:translate(-5.00px,-5.00px); }
  6.25% { transform:translate(-4.62px,-3.97px); }

  93.75% { transform:translate(-4.62px,-3.97px); }
  100% { transform:translate(-5.00px,-5.00px); }
}

@keyframes settle {
