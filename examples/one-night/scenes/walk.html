<!doctype html>
<!-- One Night, shot 1. All movement is evaluated on the local scene clock. The camera trails the
     walker's advance, so he climbs and moves right in frame while the path slides under him. -->
<meta charset="utf-8">
<style>
/* Independent coastal plates and fixed-size character drawings. */
#world, .plane { width:1920px; height:1080px; position:absolute; }
img { position:absolute; object-fit:fill; }
.shimmer-a { animation: sheen-a 2.5s ease-in-out infinite; }
.shimmer-b { animation: sheen-b 2.5s ease-in-out infinite; }
@keyframes sheen-a {
  from { transform:translate(-5px,0px); opacity:.62; }
  50% { transform:translate(5px,2px); opacity:.91; }
  to { transform:translate(-5px,0px); opacity:.62; }
}
@keyframes sheen-b {
  from { transform:translate(4px,0px); opacity:.74; }
  50% { transform:translate(-4px,2px); opacity:.40; }
  to { transform:translate(4px,0px); opacity:.74; }
}
#man { position:absolute; }
.shadow { position:absolute; background:radial-gradient(ellipse farthest-side, #02060bbd, #05091060 42%, transparent 100%); }
.hem { animation: gust 2.5s ease-in-out infinite; }
@keyframes gust {
  from { transform:translate(-4px,0px); }
  40% { transform:translate(4px,-3px); }
  74% { transform:translate(1px,0px); }
  to { transform:translate(-4px,0px); }
}
/* Weight follows the stance leg: lowest in double support, highest and
   shifted over the planted foot at mid-stance. */
 .weight { animation: shoulders .94s linear infinite; }
@keyframes shoulders {
  0% { transform:translate(1.91px,0.97px); }
  6.25% { transform:translate(-0.00px,2.00px); }
  12.5% { transform:translate(-1.91px,0.97px); }
  18.75% { transform:translate(-3.54px,-1.50px); }
  25% { transform:translate(-4.62px,-3.97px); }
  31.25% { transform:translate(-5.00px,-5.00px); }
  37.5% { transform:translate(-4.62px,-3.97px); }
  43.75% { transform:translate(-3.54px,-1.50px); }
  50% { transform:translate(-1.91px,0.97px); }
  56.25% { transform:translate(-0.00px,2.00px); }
  62.5% { transform:translate(1.91px,0.97px); }
  68.75% { transform:translate(3.54px,-1.50px); }
  75% { transform:translate(4.62px,-3.97px); }
  81.25% { transform:translate(5.00px,-5.00px); }
  87.5% { transform:translate(4.62px,-3.97px); }
  93.75% { transform:translate(3.54px,-1.50px); }
  100% { transform:translate(1.91px,0.97px); }
}
.leg0 { animation: stride0 .94s step-end infinite; }
@keyframes stride0 { 0.0% { opacity:1; } 6.25% { opacity:0; } 100% { opacity:0; } }
.leg1 { animation: stride1 .94s step-end infinite; }

.leg9 { animation: stride9 .94s step-end infinite; }

.leg14 { animation: stride14 .94s step-end infinite; }
@keyframes stride14 { 0% { opacity:0; } 87.5% { opacity:1; } 93.75% { opacity:0; } 100% { opacity:0; } }
.leg15 { animation: stride15 .94s step-end infinite; }
@keyframes stride15 { 0% { opacity:0; } 93.75% { opacity:1; } 100.0% { opacity:0; } }
</style>
