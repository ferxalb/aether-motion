<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reveals</title>
<style>
  #root { background: #070b16; }
  .clip { position: absolute; }
  .bar { left: 360px; top: 300px; width: 1200px; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #4be0b8, #6f8dff); }
  .panel { left: 360px; top: 380px; width: 1200px; height: 320px; border-radius: 36px; background: linear-gradient(135deg, #1f2a5a, #3a1f6b); box-shadow: 0 30px 80px 0 #00000066; }
  .title { left: 60px; top: 90px; width: 1080px; color: #ffffff; font-size: 110px; font-weight: 800; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="reveal" data-width="1920" data-height="1080" data-duration="4">
  <!-- The bar grows from the left, then the panel is uncovered from the bottom while its text rises. -->
  <div class="clip bar" data-start="0" data-duration="4" data-track-index="0"
       data-hf-reveal="from-left" data-hf-reveal-duration="0.9"></div>
  <div class="clip panel" data-start="0.4" data-duration="3.6" data-track-index="1"
       data-hf-reveal="from-bottom" data-hf-reveal-duration="1" data-hf-reveal-easing="ease-in-out-cubic">
    <div class="clip title" data-start="0" data-duration="4" data-track-index="2"
         data-hf-split="words" data-hf-stagger="0.12" data-hf-split-from="mask">Reveal anything</div>
  </div>
</div>
</body>
</html>
