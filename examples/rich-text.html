<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rich text, gradient text, and outlines</title>
<style>
  #root { background: #0b0d14; }
  .clip { position: absolute; }
  #headline { left: 160px; top: 120px; width: 1600px; color: #e8ecff; font-size: 104px; font-weight: 800; text-align: center; line-height: 1.15; }
  .accent { background: linear-gradient(90deg, #ff6b3d, #ffd60a); background-clip: text; -webkit-background-clip: text; color: transparent; }
  .muted { color: #7d86a8; font-weight: 400; }
  #outline { left: 160px; top: 520px; width: 1600px; font-size: 180px; font-weight: 900; text-align: center;
             color: transparent; -webkit-text-stroke: 3px #4a7dff; }
  #outline strong { -webkit-text-fill-color: #4a7dff; }
  #gradient { left: 160px; top: 800px; width: 1600px; font-size: 120px; font-weight: 800; text-align: center;
              background: linear-gradient(90deg, #3d7bff, #b03dff, #ff3d8b); background-clip: text; color: transparent; }
  code { color: #1fbf8f; }
</style>
</head>
<body>
<div id="root" data-composition-id="rich-text" data-width="1920" data-height="1080" data-duration="3">
  <div id="headline" class="clip" data-start="0" data-duration="3" data-track-index="0"
       data-hf-keyframes='[{"at":0,"y":30,"opacity":0},{"at":0.6,"y":0,"opacity":1,"easing":"ease-out-cubic"}]'>
    Make <span class="accent">motion</span> from <code>HTML</code>,<br><span class="muted">rendered</span> natively.
  </div>
  <div id="outline" class="clip" data-start="0" data-duration="3" data-track-index="0">OUT<strong>LINE</strong></div>
  <div id="gradient" class="clip" data-start="0" data-duration="3" data-track-index="0">Gradient text</div>
</div>
</body>
</html>
