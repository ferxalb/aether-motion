<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @keyframes swing {
      from { transform: rotate(-12deg) scale(0.9); }
      to   { transform: rotate(12deg) scale(1); }
    }
    .card {
      left: 190px; top: 100px; width: 260px; height: 160px; border-radius: 18px;
      background: linear-gradient(to right, #1d3855, #274a6d);
      border: 2px solid hsla(162, 70%, 58%, 0.6);
      box-shadow: 0 16px 28px 0 rgba(0, 0, 0, 0.55);
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
      animation: swing 1.5s ease-in-out infinite alternate both;
    }
    h1 { font-size: 34px; color: #f4f8ff; }
    .tag { font-size: 18px; color: hsl(162 70% 58%); }
  </style>
</head>
<body>
  <main data-composition-id="rotate" data-width="640" data-height="360" data-duration="3"
        style="background: #0b1020">
    <div class="clip card" data-start="0" data-duration="3">
      <h1 class="clip" data-start="0" data-duration="3">Rotating</h1>
      <div class="clip tag" data-start="0" data-duration="3">layers, natively</div>
    </div>
  </main>
</body>
</html>
