<!doctype html>
<!-- Shader showcase: the procedural shader blocks in one directed sequence. An intro over a liquid backdrop draws its ring and title, crossfades into an aurora night where a lower third dissolves in, and pushes into a perspective grid for the closing call to action. Every background is a native data-hf-shader program; see docs/shaders.md. -->
<html>
<head>
  <meta charset="utf-8">
  <!-- Theme: dark navy with mint and blue accents. Add it to the document and give the root background: var(--bg, #070b16). -->
<style>
  :root {
    --bg: #070b16;
    --text: #f5f8ff;
    --muted: #8fa3c4;
    --accent: #4be0b8;
    --accent-2: #6f8dff;
    --on-accent: #05070f;
    --panel: #ffffff1a;
    --line: #ffffff40;
    --glow-a: #6f8dff57;
    --glow-a-fade: #6f8dff00;
    --glow-b: #4be0b83d;
    --glow-b-fade: #4be0b800;
  }
</style>
</head>
<body>
  <div id="root" data-composition-id="shader-showcase" data-width="1920" data-height="1080" data-duration="13" style="background: var(--bg, #070b16)">
    <div id="intro" class="clip" data-start="0" data-duration="4.8" data-track-index="0" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;">
      <!-- Complete intro scene for a 1920x1080 composition: a liquid gradient backdrop, a glowing ring that draws itself around a monogram, a title that rises out of a mask, and a subtitle. Wrap it in a full-size clip that sets data-start and data-duration (4 s or more); add data-hf-fade-out or a data-hf-transition to that clip for the exit. Colors follow the theme. -->
      <style>
        #intro-a { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .intro-a-bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .intro-a-ring { position: absolute; left: 780px; top: 150px; width: 360px; height: 360px; }
        .intro-a-mono { position: absolute; left: 780px; top: 266px; width: 360px; font-size: 104px; font-weight: 800; color: var(--text, #f5f8ff); text-align: center; }
        .intro-a-title { position: absolute; left: 160px; top: 590px; width: 1600px; font-size: 104px; font-weight: 800; color: var(--text, #f5f8ff); text-align: center; text-shadow: 0 8px 40px #00000080; }
        .intro-a-sub { position: absolute; left: 360px; top: 742px; width: 1200px; font-size: 36px; line-height: 1.3; color: var(--muted, #8fa3c4); text-align: center; }
      </style>
      <div id="intro-a">
        <div class="intro-a-bg" data-hf-shader="
          let p = vec2(uv.x * aspect, uv.y) * 1.4;
          let s = t * 0.08;
          let q = vec2(fbm(vec3(p, s), 4), fbm(vec3(p + vec2(5.2, 1.3), s), 4));
          let f = fbm(vec3(p + q * 2.2, s * 1.4), 4);
          let k = saturate((f - 0.5) * 2.6 + 0.5);
          let c = mix(base, tint_b * 0.6, smoothstep(0.2, 0.9, k));
          let c = mix(c, tint_a * 0.55, smoothstep(0.4, 0.9, saturate((q.x - 0.5) * 2.6 + 0.5)) * 0.8);
          let focus = 1.0 - smoothstep(0.1, 0.9, length((uv - vec2(0.5, 0.42)) * vec2(aspect, 1.0)) * 0.9);
          rgb(c * (0.45 + 0.75 * focus))
        " data-hf-shader-resolution="0.25" data-hf-shader-uniforms='{"base": "var(--bg, #070b16)", "tint_a": "var(--accent, #4be0b8)", "tint_b": "var(--accent-2, #6f8dff)"}' data-hf-keyframes='[{"at": 0, "opacity": 0}, {"at": 1, "opacity": 1, "easing": "ease-out-cubic"}]'></div>
        <div class="intro-a-ring" data-hf-bloom="1.4" data-hf-bloom-radius="36" data-hf-shader="
          let p = (uv - 0.5) * 2.0;
          let pol = polar(p);
          let along = fract(pol.y + 0.25);
          let ring = smoothstep(0.04, 0.0, abs(pol.x - 0.8));
          let drawn = smoothstep(progress, progress - 0.015, along);
          let head = smoothstep(0.06, 0.0, abs(along - progress)) * step(along, progress) * smoothstep(1.02, 0.95, progress);
          let shimmer = 0.8 + 0.4 * noise(vec2(pol.y * 28.0, t * 1.4));
          let c = mix(tint_a, tint_b, 0.5 - 0.5 * cos(along * tau)) * shimmer + head * 0.6;
          rgba(c, ring * drawn)
        " data-hf-shader-uniforms='{"tint_a": "var(--accent, #4be0b8)", "tint_b": "var(--accent-2, #6f8dff)", "progress": 0}' data-hf-shader-keyframes='[{"at": 0.3, "progress": 0}, {"at": 1.8, "progress": 1.03, "easing": "ease-in-out-cubic"}]'></div>
        <div class="intro-a-mono" data-hf-keyframes='[{"at": 0.9, "y": 16, "opacity": 0}, {"at": 1.6, "y": 0, "opacity": 1, "easing": "ease-out-expo"}]'>Æ</div>
        <div class="intro-a-title" data-hf-reveal="from-bottom" data-hf-reveal-at="1.3" data-hf-reveal-duration="0.9" data-hf-keyframes='[{"at": 1.3, "y": 36}, {"at": 2.2, "y": 0, "easing": "ease-out-expo"}]'>Procedural, by design</div>
        <div class="intro-a-sub" data-hf-keyframes='[{"at": 2.0, "y": 22, "opacity": 0}, {"at": 2.8, "y": 0, "opacity": 1, "easing": "ease-out-expo"}]'>Native shaders, deterministic on every machine.</div>
      </div>
    </div>
    <div id="night" class="clip" data-start="intro-0.8" data-duration="5" data-track-index="1" data-hf-transition="crossfade" data-hf-transition-from="intro" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;">
      <!-- Animated aurora backdrop for a 1920x1080 composition: luminous ribbons drift over a dark sky with faint stars, drawn by a native procedural shader. Put it first in the root; it follows the theme's --accent, --accent-2, and --bg colors. speed scales the motion. -->
      <div id="sky" data-hf-shader="
        let p = vec2(uv.x * aspect, uv.y);
        let s = t * speed;
        let warp = fbm(vec3(p * 1.1, s * 0.08), 4);
        let q = vec2(p.x * 0.8 + warp * 1.3, p.y * 2.2 + sin(p.x * 1.7 + s * 0.2) * 0.4);
        let band = fbm(vec3(q * vec2(0.7, 1.0), s * 0.05 + 3.1), 5);
        let ribbon = smoothstep(0.44, 0.7, band) * smoothstep(0.0, 0.22, uv.y) * smoothstep(0.98, 0.5, uv.y);
        let curtain = 0.65 + 0.35 * noise(vec2(p.x * 26.0 + warp * 5.0, s * 0.35));
        let glow = mix(tint_a, tint_b, smoothstep(0.3, 0.8, 1.0 - uv.y + (warp - 0.5) * 0.9 + uv.x * 0.15));
        let sky = mix(base * 0.8, base * 2.0 + tint_a * 0.05, smoothstep(0.2, 1.0, uv.y));
        let star = step(0.9975, hash(floor(px / 2.0))) * smoothstep(0.8, 0.1, uv.y) * (1.0 - ribbon);
        rgb(sky + glow * ribbon * curtain * 1.2 + glow * ribbon * ribbon * 0.25 + star * 0.6)
      " data-hf-shader-resolution="0.5" data-hf-shader-uniforms='{"tint_a": "var(--accent, #4be0b8)", "tint_b": "var(--accent-2, #6f8dff)", "base": "var(--bg, #070b16)", "speed": 1.2}' style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;"></div>
      <div class="clip" data-start="5.0" data-duration="3.6" data-hf-fade-out="0.5" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;">
      <!-- Lower third for a 1920x1080 scene: a name and a role on a glass bar that dissolves in along a procedural noise edge with a glowing rim. Wrap it in a clip that sets data-start and data-duration (3 s or more) and add data-hf-fade-out to that clip for the exit. -->
      <style>
        #credit { position: absolute; left: 120px; top: 812px; width: 860px; height: 150px; }
        .credit-bar { position: absolute; left: 0; top: 0; width: 860px; height: 150px; border-radius: 22px; overflow: hidden; }
        .credit-mark { position: absolute; left: 40px; top: 36px; width: 8px; height: 78px; border-radius: 4px; background: linear-gradient(180deg, var(--accent, #4be0b8), var(--accent-2, #6f8dff)); }
        .credit-name { position: absolute; left: 76px; top: 26px; width: 760px; font-size: 52px; font-weight: 800; color: var(--text, #f5f8ff); }
        .credit-role { position: absolute; left: 78px; top: 90px; width: 760px; font-size: 28px; font-weight: 500; letter-spacing: 2px; color: var(--muted, #8fa3c4); }
      </style>
      <div id="credit">
        <div class="credit-bar" data-hf-shader="
          let n = fbm(px / 46.0 + vec2(0.0, t * 0.25), 4);
          let f = uv.x * 0.8 + n * 0.2;
          let edge = progress * 1.12 - 0.06;
          let body = smoothstep(edge, edge - 0.03, f);
          let rim = smoothstep(0.022, 0.0, abs(f - edge)) * smoothstep(1.0, 0.9, progress) * step(0.001, progress);
          let sheen = 0.85 + 0.3 * noise(vec2(px.x / 170.0 - t * 0.35, px.y / 70.0));
          let c = mix(panel, panel * 1.5, uv.y) * sheen;
          rgba(mix(c, accent, rim), max(body * 0.94, rim))
        " data-hf-shader-uniforms='{"panel": "#121a2e", "accent": "var(--accent, #4be0b8)", "progress": 0}' data-hf-shader-keyframes='[{"at": 0, "progress": 0}, {"at": 0.9, "progress": 1, "easing": "ease-in-out-cubic"}]'></div>
        <div class="credit-mark" data-hf-keyframes='[{"at": 0.35, "y": 20, "opacity": 0}, {"at": 0.85, "y": 0, "opacity": 1, "easing": "ease-out-expo"}]'></div>
        <div class="credit-name" data-hf-keyframes='[{"at": 0.45, "x": -24, "opacity": 0}, {"at": 1.05, "x": 0, "opacity": 1, "easing": "ease-out-expo"}]'>Northern Lights</div>
        <div class="credit-role" data-hf-keyframes='[{"at": 0.6, "x": -24, "opacity": 0}, {"at": 1.2, "x": 0, "opacity": 1, "easing": "ease-out-expo"}]'>GENERATED IN REAL TIME</div>
      </div>
      </div>
    </div>
    <div id="grid" class="clip" data-start="night-0.7" data-duration="4.7" data-track-index="2" data-hf-transition="push-up" data-hf-transition-from="night" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;">
      <!-- Perspective grid backdrop for a 1920x1080 composition: a glowing floor grid that scrolls toward the horizon under a soft horizon light, drawn by a native procedural shader. Put it first in the root. Colors follow the theme's --bg and --accent; speed is grid cells per second and horizon the height of the horizon (0 top, 1 bottom). -->
      <div id="floor" data-hf-shader="
        let y = uv.y - horizon;
        let depth = 0.3 / max(y, 0.003);
        let g = vec2((uv.x - 0.5) * aspect * depth * 3.0, depth * 3.0 + t * speed);
        let d = abs(fract(g + 0.5) - 0.5);
        let w = 0.02 * depth + 0.012;
        let lines = max(smoothstep(w, 0.0, d.x), smoothstep(w * 1.3, 0.0, d.y));
        let fade = step(0.0, y) * smoothstep(0.0, 0.2, y) * (0.35 + 0.65 * smoothstep(0.0, 0.6, y));
        let pulse = 0.65 + 0.35 * smoothstep(0.7, 1.0, sin(g.y * 0.35 - t * 2.0));
        let halo = exp(-abs(y) * 11.0) * 0.55 + exp(-abs(y) * 3.0) * 0.12;
        let sky = mix(base * 0.7, base * 1.6, smoothstep(0.0, horizon, uv.y));
        rgb(sky + line * lines * fade * pulse + line * halo)
      " data-hf-shader-resolution="0.5" data-hf-shader-uniforms='{"line": "var(--accent, #4be0b8)", "base": "var(--bg, #070b16)", "speed": 0.8, "horizon": 0.52}' style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;"></div>
      <div class="clip" data-start="9.0" data-duration="4" style="position: absolute; left: 0; top: -120px; width: 1920px; height: 1080px;">
      <!-- Closing call to action for a 1920x1080 scene: headline, gradient button, and URL. Wrap it in a clip that sets data-start and data-duration. -->
      <style>
        @keyframes close-pop {
          from { transform: translate(0, 30px) scale(0.85); opacity: 0; }
          to { transform: translate(0, 0) scale(1); opacity: 1; }
        }
        #close { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; }
        .close-title { width: 1500px; font-size: 112px; font-weight: 800; color: var(--text, #f5f8ff); text-align: center; text-shadow: 0 8px 40px #00000099; }
        .close-button { display: flex; padding: 28px 84px; border-radius: 80px; background: linear-gradient(135deg, var(--accent, #4be0b8), var(--accent-2, #6f8dff)); box-shadow: 0 20px 60px 0 var(--glow-b, #4be0b83d); animation: close-pop 0.8s ease-out 0.9s 1 both; }
        .close-label { font-size: 42px; font-weight: 700; color: var(--on-accent, #05070f); }
        .close-url { font-size: 30px; letter-spacing: 3px; color: var(--muted, #8fa3c4); text-align: center; animation: close-pop 0.8s ease-out 1.2s 1 both; }
      </style>
      <div id="close">
        <div class="close-title" data-hf-split="words" data-hf-stagger="0.1" data-hf-split-easing="ease-out-expo">Write a shader, render a film</div>
        <div class="close-button"><div class="close-label">aether-motion block list</div></div>
        <div class="close-url">docs/shaders.md</div>
      </div>
      </div>
    </div>
  </div>
</body>
</html>
