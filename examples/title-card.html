<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .clip { position: absolute; left: 0; top: 0; width: 100%; height: 100%; visibility: hidden;
      display: flex; align-items: center; justify-content: center; }
    .clip h1 { color: white; font-family: sans-serif; font-size: 56px; text-align: center; }
    .first { background: #153a67; }
    .second { background: #ad4037; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="title-card" data-width="640" data-height="360"
       data-duration="4" style="position: relative; background: #101522">
    <div id="intro" class="clip first" data-start="0" data-duration="2" data-track-index="0"
         data-hf-fade-in="0.35" data-hf-fade-out="0.35"><h1>Hello, world</h1></div>
    <div id="outro" class="clip second" data-start="intro" data-duration="2" data-track-index="0"
         data-hf-fade-in="0.35"><h1>Native Rust</h1></div>
  </div>
</body>
</html>
