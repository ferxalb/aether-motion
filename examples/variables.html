<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- One template, many videos: pass values with
       aether-motion render examples/variables.html --variables-file examples/variables.json -->
  <style>
    .clip { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .glow { background: radial-gradient(ellipse farthest-side at 50% 40%, var(--accent), transparent); opacity: 0.55; }
    .stack { display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 28px; padding: 0 200px; }
    .title { color: #ffffff; font-family: sans-serif; font-weight: bold; font-size: var(--titleSize);
      text-align: center; white-space: nowrap; }
    .subtitle { color: #c9d1e6; font-family: sans-serif; font-size: 40px; text-align: center; }
    .badge { position: absolute; left: 200px; top: 130px; width: 150px; height: 56px; border-radius: 28px;
      background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .badge-text { color: #0b0f1a; font-family: sans-serif; font-weight: bold; font-size: 28px; }
  </style>
  <style data-var-if="align=left">
    .stack { align-items: flex-start; }
    .title, .subtitle { text-align: left; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="variables" data-width="1920" data-height="1080" data-duration="4"
       style="position: relative; background: #0b0f1a"
       data-composition-variables='[
         {"id": "title", "type": "string", "label": "Title", "default": "Launch day", "maxLength": 28},
         {"id": "subtitle", "type": "string", "label": "Subtitle", "default": "Everything ships at 9:00"},
         {"id": "accent", "type": "color", "label": "Accent", "default": "#4be0b8"},
         {"id": "titleSize", "type": "number", "label": "Title size", "default": 132, "min": 48, "max": 200, "unit": "px"},
         {"id": "showBadge", "type": "boolean", "label": "Show badge", "default": true},
         {"id": "align", "type": "enum", "label": "Alignment", "default": "center",
          "options": [{"value": "center", "label": "Centered"}, {"value": "left", "label": "Left"}]}
       ]'>
    <div class="clip glow" data-start="0" data-duration="4" data-track-index="0"></div>
    <div class="clip stack" data-start="0" data-duration="4" data-track-index="1">
      <div id="title" class="title" data-var-text="title" data-hf-split="words" data-hf-stagger="0.08">Launch day</div>
      <div id="subtitle" class="subtitle" data-var-text="subtitle"
           data-hf-keyframes='[{"at":0.3,"y":24,"opacity":0},{"at":0.9,"y":0,"opacity":1,"easing":"ease-out-cubic"}]'>Everything ships at 9:00</div>
    </div>
    <div id="badge" class="badge clip" data-start="0.6" data-duration="3.4" data-track-index="2"
         data-var-if="showBadge" data-hf-fade-in="0.3"><span class="badge-text">NEW</span></div>
  </div>
</body>
</html>
