<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #0b1020; --accent: hsl(162 70% 58%); }
    @keyframes rise {
      from { transform: translate(0, 28px); opacity: 0; }
      to   { transform: translate(0, 0); opacity: 1; }
    }
    .stage {
      left: 0; top: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 20px; padding: 40px;
    }
    h1 {
      max-width: 520px; font-size: 44px; line-height: 1.2; text-align: center; color: #f4f8ff;
      animation: rise 0.7s ease-out both;
    }
    p {
      max-width: 420px; font-size: 20px; line-height: 1.4; text-align: center; color: var(--accent);
      animation: rise 0.7s ease-out 0.25s both;
    }
  </style>
</head>
<body>
  <main data-composition-id="wrapped-title" data-width="640" data-height="360"
        data-duration="3" style="background: var(--bg)">
    <div class="clip stage" data-start="0" data-duration="3" data-track-index="0">
      <h1 class="clip" data-start="0" data-duration="3">Long titles now wrap naturally inside a maximum width</h1>
      <p class="clip" data-start="0" data-duration="3">Line height, alignment, and flex sizing all follow the wrapped block.</p>
    </div>
  </main>
</body>
</html>
