<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #root { background: #0b1020; }
    .clip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex;
      align-items: center; justify-content: center; }
    h1 { color: white; font-family: sans-serif; font-size: 96px; font-weight: 800; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="my-video" data-width="1920" data-height="1080" data-duration="4">
    <div id="title" class="clip" data-start="0" data-duration="4" data-track-index="0"
         data-hf-fade-in="0.4" data-hf-fade-out="0.4">
      <h1 data-hf-split="words" data-hf-split-from="up">Hello, AETHER</h1>
    </div>
  </div>
</body>
</html>
